import org.gradle.api.tasks.bundling.Jar

plugins {
    id 'maven-publish'
    id "net.neoforged.moddev.legacyforge" version "2.0.141"
}
apply plugin: "java"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
//Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.


base {
    archivesName = "gravisuit"
}


version = "${mod_version}"
group = "trinsdar.gravisuit" // http://maven.apache.org/guides/mini/guide-naming-conventions.html


legacyForge {
    version = "${project.minecraft_version}-${project.forge_version}"
    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = project.mappings_version
    }

    runs {
        client {
            client()
        }
        data {
            data()
        }
        server {
            server()
            gameDirectory = project.file('run/server')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories{
    maven { url "https://dist.creeper.host/Sponge/maven" }
    maven { // Tech Reborn
        name 'Tech Reborn'
        url 'https://maven.modmuss50.me/'
    }
    maven { // Buildcraft
        name 'buildcraft'
        url 'https://mod-buildcraft.com/maven/'
    }
    maven { // CCL, CCC, NEI
        name 'Chickenbones Repo'
        url 'https://chickenbones.net/maven/'
    }
    maven {
        name = 'parchment'
        url = 'https://maven.parchmentmc.org'
    }
    maven { // The One Probe, EnderIO, EnderCore
        name 'tterrag'
        url 'https://maven.tterrag.com/'
    }
    maven { // CoFH
        name 'Covers Maven'
        url 'https://maven.covers1624.net/'
    }
    maven { // McJtyLib
        url "https://modmaven.k-4u.nl"
    }
    maven {
        url = "https://www.cursemaven.com"
    }
    maven { // JEI
        name 'DVS1 Maven FS'
        url 'https://dvs1.progwml6.com/files/maven/'
    }
    maven { url "https://maven.shedaniel.me" }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url 'https://repo.repsy.io/mvn/trinsdar/trins-mods/'
    }
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Apply Mixin AP
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    modImplementation("curse.maven:ic2_classic-242942:8010709")
    modImplementation("curse.maven:ic2c_additions-304040:4360883")
    modImplementation("curse.maven:curios-309927:3871347")
    modImplementation("curse.maven:lootr-361276:4596364")
    modImplementation("curse.maven:applied-energistics-2-223794:4733119")
    modImplementation("curse.maven:jei-238222:4712866")
    modImplementation("maven.modrinth:carbon-config:HMD2FUea")
//    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-forge:${rootProject.rei_version}"
//    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-plugin-compatibilities-forge:9.1.530"
    modImplementation('io.github.trinsdar:PlayerAbilityLib:1.6.0.1')
    implementation('io.github.trinsdar:trins-wiki-lib:1.0.0'){
        transitive = false
    }
    jarJar('io.github.trinsdar:PlayerAbilityLib:1.6.0.1')
    jarJar('io.github.trinsdar:trins-wiki-lib:1.0.0')
    //implementation fg.deobf("curse.maven:sophisticated-backpacks-422301:5194759")
    modImplementation("curse.maven:sophisticated-core-618298:5296313")
    modImplementation("curse.maven:advanced-solars-classic-314835:5693305")
}

mixin {
    add sourceSets.main, 'gravisuit.mixins.refmap.json'
    config 'gravisuit.mixins.json'
}

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.mod_version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.mod_version
    }
}

jar{
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : "Trinsdar",
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : "Trinsdar",
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs":"gravisuit.mixins.json"
        ])
    }
}
